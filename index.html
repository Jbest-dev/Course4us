<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liste de courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F6EE; --ink:#213B2C; --soft:#5E7866; --card:#FFFFFF; --line:#D9E6D3;
  --green:#2F8F5B; --green-ink:#FFFFFF; --chip:#E6F0E1; --tomato:#E2553F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16211A; --ink:#E7F1E3; --soft:#9DB5A3; --card:#1F2D24; --line:#2E4234;
    --green:#5CC28A; --green-ink:#10301F; --chip:#27392D; --tomato:#F07A64;
  }
}
:root[data-theme="dark"]{
  --bg:#16211A; --ink:#E7F1E3; --soft:#9DB5A3; --card:#1F2D24; --line:#2E4234;
  --green:#5CC28A; --green-ink:#10301F; --chip:#27392D; --tomato:#F07A64;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.5;}
main{max-width:640px; margin:0 auto; padding:1.25rem 1rem 6rem;}
h1{font-family:"Fredoka","Arial Rounded MT Bold",system-ui,sans-serif; font-weight:700; font-size:clamp(2rem,7vw,2.8rem); line-height:1.05; margin:.5rem 0 .2rem;}
.status{font-size:.88rem; color:var(--soft); margin:0 0 1.25rem; display:flex; align-items:center; gap:.4rem;}
.status i{width:8px; height:8px; border-radius:50%; background:var(--soft); display:inline-block;}
.status.shared i{background:var(--green);}

.tabs{display:flex; gap:.4rem; background:var(--chip); padding:.3rem; border-radius:999px; margin-bottom:1.25rem; position:sticky; top:env(safe-area-inset-top,0px); z-index:5;}
.tab{flex:1; border:0; background:transparent; color:var(--ink); font:inherit; font-weight:800; padding:.6rem .5rem; border-radius:999px; cursor:pointer; display:flex; justify-content:center; align-items:center; gap:.45rem;}
.tab[aria-selected="true"]{background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.08);}
.badge{min-width:1.4rem; height:1.4rem; padding:0 .4rem; border-radius:999px; background:var(--tomato); color:#fff; font-size:.8rem; display:inline-flex; align-items:center; justify-content:center;}
.badge[hidden]{display:none;}

.row{display:flex; gap:.5rem;}
input[type=text],select{font:inherit; color:var(--ink); background:var(--card); border:2px solid var(--line); border-radius:14px; padding:.6rem .8rem; min-width:0;}
input[type=text]{flex:1;}
button{font:inherit; cursor:pointer;}
.btn{border:2px solid var(--green); background:var(--green); color:var(--green-ink); font-weight:800; border-radius:14px; padding:.55rem 1rem;}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line);}
.btn.ghost:hover{border-color:var(--green);}
.btn:disabled{opacity:.5; cursor:default;}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--green); outline-offset:2px;}

.cat{margin-top:1.4rem;}
.cat h2{font-family:"Fredoka",sans-serif; font-weight:600; font-size:1.05rem; margin:0 0 .55rem; display:flex; gap:.45rem; align-items:center;}
.cat h2 small{font-family:"Nunito",sans-serif; font-weight:600; color:var(--soft); font-size:.85rem;}

.chips{display:flex; flex-wrap:wrap; gap:.45rem;}
.chip{position:relative; border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:.4rem .9rem; font-weight:700; transition:background .15s, border-color .15s;}
.chip.on{background:var(--green); border-color:var(--green); color:var(--green-ink);}
.chip.on::before{content:"✓ ";}
.chip .x{display:none;}
.pill{display:inline-flex; align-items:stretch;}
.pill .chip{border-top-right-radius:0; border-bottom-right-radius:0; border-right:0;}
.star{border:2px solid var(--line); border-left:1px solid var(--line); background:var(--card); color:var(--soft); border-radius:0 999px 999px 0; padding:0 .65rem 0 .5rem; font-size:1rem; line-height:1;}
.star.on{color:#E0A800;}
.pill .chip.on + .star{border-color:var(--green); border-left-color:rgba(255,255,255,.35); background:var(--green); color:var(--green-ink);}
.pill .chip.on + .star.on{color:#FFD54A;}
.editing .star{display:none;}
.editing .pill .chip{border-radius:999px; border-right:2px solid var(--line);}
.fav-head{display:flex; justify-content:space-between; align-items:center; gap:.5rem; flex-wrap:wrap; margin-bottom:.55rem;}
.fav-head h2{margin:0;}
#productName{flex:1 1 100%;} #productCat{flex:1;}
.top{display:flex; justify-content:space-between; align-items:center; gap:.75rem;}
.btn.small{padding:.3rem .8rem; font-size:.88rem; border-radius:999px;}
.editing .chip{padding-right:2.1rem;}
.editing .chip .x{display:flex; position:absolute; right:.3rem; top:50%; transform:translateY(-50%); width:1.5rem; height:1.5rem; border-radius:50%; background:var(--tomato); color:#fff; align-items:center; justify-content:center; font-size:.9rem; line-height:1;}
.edit-bar{display:flex; justify-content:space-between; align-items:center; margin-top:.9rem; gap:.5rem; flex-wrap:wrap;}
.hint{color:var(--soft); font-size:.9rem; margin:.6rem 0 0;}

.items{list-style:none; margin:0; padding:0; background:var(--card); border:2px solid var(--line); border-radius:18px; overflow:hidden;}
.item{display:flex; align-items:center; gap:.75rem; padding:.7rem .9rem; border-bottom:1px solid var(--line); cursor:pointer; user-select:none;}
.item:last-child{border-bottom:0;}
.box{width:1.5rem; height:1.5rem; border-radius:8px; border:2px solid var(--green); flex:none; display:flex; align-items:center; justify-content:center; color:var(--green-ink); font-weight:800; font-size:.9rem;}
.item.done .box{background:var(--green);}
.item.done .box::after{content:"✓";}
.item .name{flex:1; font-weight:700; overflow-wrap:anywhere;}
.item.done .name{text-decoration:line-through; color:var(--soft); font-weight:600;}
.item .rm{border:0; background:transparent; color:var(--soft); width:2rem; height:2rem; border-radius:50%; font-size:1.2rem;}
.item .rm:hover{color:var(--tomato);}

.empty{text-align:center; padding:2.5rem 1rem; color:var(--soft);}
.empty strong{display:block; font-family:"Fredoka",sans-serif; font-weight:600; font-size:1.3rem; color:var(--ink); margin-bottom:.3rem;}
.actions{display:flex; gap:.5rem; flex-wrap:wrap; margin-top:1.25rem;}
.toast{position:fixed; left:50%; bottom:calc(1.25rem + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(calc(100% + 3rem)); visibility:hidden; background:var(--ink); color:var(--bg); padding:.6rem 1.1rem; border-radius:999px; font-weight:700; transition:transform .25s; z-index:20;}
.toast.show{transform:translateX(-50%) translateY(0); visibility:visible;}
[hidden]{display:none !important;}
@media (prefers-reduced-motion:reduce){ .chip,.toast{transition:none;} }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Les courses</h1>
    <button class="btn ghost small" id="invite" hidden>Inviter</button>
  </div>
  <p class="status" id="status"><i></i><span>Chargement…</span></p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-list" aria-selected="true">La liste <span class="badge" id="count" hidden>0</span></button>
    <button class="tab" role="tab" id="tab-products" aria-selected="false">Mes produits</button>
  </div>

  <!-- LISTE -->
  <section id="view-list">
    <form class="row" id="quickForm">
      <input type="text" id="quickName" placeholder="Ajouter un article ponctuel…" maxlength="50" aria-label="Article ponctuel">
      <button class="btn" type="submit">Ajouter</button>
    </form>
    <div id="listBody"></div>
    <div class="actions" id="listActions" hidden>
      <button class="btn ghost" id="removeDone">Retirer les articles cochés</button>
      <button class="btn ghost" id="copy">Copier la liste</button>
      <button class="btn ghost" id="clearList">Vider la liste</button>
    </div>
  </section>

  <!-- PRODUITS -->
  <section id="view-products" hidden>
    <p class="hint" style="margin-top:0">Touchez vos produits habituels pour les mettre dans la liste, et l'étoile pour les garder en favoris.</p>
    <form class="row" id="productForm" style="margin-top:.8rem; flex-wrap:wrap">
      <input type="text" id="productName" placeholder="Nouveau produit…" maxlength="50" aria-label="Nouveau produit">
      <select id="productCat" aria-label="Rayon"></select>
      <button class="btn" type="submit">Créer</button>
    </form>
    <div id="productsBody"></div>
    <div class="edit-bar">
      <button class="btn ghost" id="toggleEdit">Supprimer des produits</button>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
// Configuration Firebase du projet "course-107fd"
const firebaseConfig = {
  apiKey: "AIzaSyCATIu1tNBEfwUaCBnAEwr04geNjzAQ7Y4",
  authDomain: "course-107fd.firebaseapp.com",
  projectId: "course-107fd",
  storageBucket: "course-107fd.firebasestorage.app",
  messagingSenderId: "144957375090",
  appId: "1:144957375090:web:ce28e00173f6466fc9f8eb"
};
// =====================================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

(function(){
  const CATS = [
    ["fruits","🥕 Fruits & légumes"],["boulangerie","🥖 Boulangerie"],["cremerie","🧀 Crèmerie & œufs"],
    ["viande","🍗 Viandes & poissons"],["epicerie","🍝 Épicerie"],["surgeles","🧊 Surgelés"],
    ["boissons","🧃 Boissons"],["maison","🧻 Hygiène & maison"],["autre","🛒 Autre"]
  ];
  const CAT_LABEL = Object.fromEntries(CATS);
  // Produits de départ, ajoutés à la création d'une nouvelle liste
  const LOCAL_DEFAULTS = [
    ["Pommes","fruits"],["Bananes","fruits"],["Tomates","fruits"],["Salade","fruits"],["Oignons","fruits"],["Pommes de terre","fruits"],["Citrons","fruits"],
    ["Baguette","boulangerie"],["Pain de mie","boulangerie"],
    ["Lait","cremerie"],["Œufs","cremerie"],["Beurre","cremerie"],["Yaourts","cremerie"],["Fromage râpé","cremerie"],["Crème fraîche","cremerie"],
    ["Poulet","viande"],["Jambon","viande"],["Steaks hachés","viande"],["Saumon","viande"],
    ["Pâtes","epicerie"],["Riz","epicerie"],["Sauce tomate","epicerie"],["Huile d'olive","epicerie"],["Café","epicerie"],["Céréales","epicerie"],["Sucre","epicerie"],
    ["Légumes surgelés","surgeles"],["Glaces","surgeles"],
    ["Eau","boissons"],["Jus d'orange","boissons"],
    ["Papier toilette","maison"],["Liquide vaisselle","maison"],["Lessive","maison"],["Sacs poubelle","maison"],["Dentifrice","maison"]
  ];

  const $ = id => document.getElementById(id);
  const products = new Map(); // id -> {name, cat}
  const list = new Map();     // id -> {name, cat, done, at}
  let editing = false, mode = "loading";

  function slug(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "item"; }
  function newId(name){ return slug(name) + "-" + Math.random().toString(36).slice(2,7); }
  function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

  // ---------- Code de la liste partagée ----------
  // Le lien de la page contient un code secret (#l=...) : toute personne qui a ce lien partage la même liste.
  function randomCode(){ const a = new Uint8Array(20); crypto.getRandomValues(a); return Array.from(a, b => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join(""); }
  let code = null;
  const fromHash = (location.hash.match(/l=([a-z0-9]{16,40})/) || [])[1];
  try{ code = fromHash || localStorage.getItem("courses-foyer"); }catch(e){ code = fromHash; }
  if (!code) code = randomCode();
  try{ localStorage.setItem("courses-foyer", code); }catch(e){}
  history.replaceState(null, "", location.pathname + location.search + "#l=" + code);

  // ---------- Stockage : Firebase (partagé) ou sur l'appareil ----------
  const store = {
    db:null,
    ref(col, id){ return doc(this.db, "households", code, col, id); },
    async putProduct(id, data){ products.set(id,data); render(); if(this.db) await setDoc(this.ref("products",id), data); else saveLocal(); },
    async delProduct(id){ products.delete(id); render(); if(this.db) await deleteDoc(this.ref("products",id)); else saveLocal(); },
    async putItem(id, data){ list.set(id,data); render(); if(this.db) await setDoc(this.ref("list",id), data); else saveLocal(); },
    async delItem(id){ list.delete(id); render(); if(this.db) await deleteDoc(this.ref("list",id)); else saveLocal(); }
  };
  async function safe(fn){
    try{ await fn(); }
    catch(e){ console.error(e); toast("Modification non enregistrée, réessayez."); }
  }

  const LKEY = "courses-v1";
  function saveLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify({p:[...products], l:[...list]})); }catch(e){} }
  function startLocal(){
    mode = "local";
    let data = null;
    try{ data = JSON.parse(localStorage.getItem(LKEY)); }catch(e){}
    if (data && Array.isArray(data.p)){ data.p.forEach(([k,v])=>products.set(k,v)); (data.l||[]).forEach(([k,v])=>list.set(k,v)); }
    else { LOCAL_DEFAULTS.forEach(([n,c])=>products.set(newId(n),{name:n,cat:c})); saveLocal(); }
    setStatus(); render();
  }

  async function startShared(){
    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
    store.db = db; mode = "shared"; setStatus();
    $("invite").hidden = false;

    // Première ouverture d'une liste vide : on ajoute les produits de départ (une seule fois)
    const seedKey = "courses-seeded-" + code;
    let seeded = false; try{ seeded = !!localStorage.getItem(seedKey); }catch(e){}
    function seed(){
      seeded = true; try{ localStorage.setItem(seedKey, "1"); }catch(e){}
      const batch = writeBatch(db);
      LOCAL_DEFAULTS.forEach(([n,c])=>batch.set(doc(db,"households",code,"products",newId(n)),{name:n,cat:c,fav:false}));
      batch.commit().catch(e=>console.error(e));
    }

    onSnapshot(collection(db,"households",code,"products"), { includeMetadataChanges: true }, snap=>{
      if (snap.empty && !snap.metadata.fromCache && !seeded) seed();
      else if (!snap.empty && !seeded){ seeded = true; try{ localStorage.setItem(seedKey, "1"); }catch(e){} }
      products.clear(); snap.docs.forEach(d=>{ const v=d.data(); products.set(d.id,{name:v.name,cat:v.cat,fav:!!v.fav}); });
      render();
    }, e=>{ console.error(e); mode="error"; setStatus(); });
    onSnapshot(collection(db,"households",code,"list"), snap=>{
      list.clear(); snap.docs.forEach(d=>{ const v=d.data(); list.set(d.id,{name:v.name,cat:v.cat,done:!!v.done,at:v.at||0}); });
      render();
    }, e=>{ console.error(e); mode="error"; setStatus(); });
  }

  $("invite").onclick = async () => {
    const url = location.href;
    if (navigator.share){
      try{ await navigator.share({ title:"Notre liste de courses", text:"Voici notre liste de courses partagée :", url }); return; }catch(e){ if (e.name === "AbortError") return; }
    }
    try{ await navigator.clipboard.writeText(url); toast("Lien copié : envoyez-le à votre conjointe"); }
    catch(e){ prompt("Copiez ce lien et envoyez-le :", url); }
  };

  function setStatus(){
    const s = $("status"), span = s.querySelector("span");
    s.classList.toggle("shared", mode === "shared");
    span.textContent = mode === "shared" ? "Liste partagée, mise à jour en direct"
      : mode === "local" ? "Firebase pas encore configuré : liste enregistrée sur cet appareil"
      : mode === "error" ? "Connexion à la base impossible : vérifiez la configuration Firebase"
      : "Chargement…";
  }

  // ---------- Rendu ----------
  function byCat(entries){
    const g = {}; entries.forEach(([id,v])=>{ (g[v.cat in CAT_LABEL ? v.cat : "autre"] ||= []).push([id,v]); });
    return CATS.filter(([k])=>g[k]).map(([k,label])=>[k,label,g[k].sort((a,b)=>a[1].name.localeCompare(b[1].name,"fr"))]);
  }

  function renderList(){
    const body = $("listBody"); body.innerHTML = "";
    const entries = [...list];
    const todo = entries.filter(([,v])=>!v.done).length;
    $("count").textContent = todo; $("count").hidden = todo === 0;
    $("listActions").hidden = entries.length === 0;
    $("removeDone").disabled = !entries.some(([,v])=>v.done);
    if (!entries.length){
      body.innerHTML = '<div class="empty"><strong>La liste est vide</strong>Ajoutez vos produits habituels depuis l\'onglet « Mes produits ».</div>';
      return;
    }
    byCat(entries).forEach(([k,label,items])=>{
      const sec = document.createElement("div"); sec.className = "cat";
      const h = document.createElement("h2"); h.textContent = label; sec.append(h);
      const ul = document.createElement("ul"); ul.className = "items";
      items.sort((a,b)=>a[1].done-b[1].done).forEach(([id,v])=>{
        const li = document.createElement("li"); li.className = "item" + (v.done?" done":"");
        li.setAttribute("role","checkbox"); li.setAttribute("aria-checked", v.done); li.tabIndex = 0;
        const box = document.createElement("span"); box.className = "box";
        const name = document.createElement("span"); name.className = "name"; name.textContent = v.name;
        const rm = document.createElement("button"); rm.className = "rm"; rm.textContent = "×"; rm.setAttribute("aria-label","Retirer "+v.name);
        rm.onclick = e => { e.stopPropagation(); safe(()=>store.delItem(id)); };
        const toggle = () => safe(()=>store.putItem(id,{...v, done:!v.done}));
        li.onclick = toggle;
        li.onkeydown = e => { if (e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); } };
        li.append(box,name,rm); ul.append(li);
      });
      sec.append(ul); body.append(sec);
    });
  }

  function renderProducts(){
    const body = $("productsBody"); body.innerHTML = "";
    body.classList.toggle("editing", editing);
    $("toggleEdit").textContent = editing ? "Terminer" : "Supprimer des produits";
    const entries = [...products];
    if (!entries.length){
      body.innerHTML = '<div class="empty"><strong>Aucun produit</strong>Créez vos produits habituels avec le champ ci-dessus.</div>';
      return;
    }
    const favs = entries.filter(([,v])=>v.fav).sort((a,b)=>a[1].name.localeCompare(b[1].name,"fr"));
    if (favs.length){
      const sec = document.createElement("div"); sec.className = "cat";
      const head = document.createElement("div"); head.className = "fav-head";
      const h = document.createElement("h2"); h.textContent = "⭐ Mes favoris";
      head.append(h);
      const missing = favs.filter(([id])=>!list.has(id));
      if (!editing && missing.length){
        const all = document.createElement("button"); all.className = "btn small";
        all.textContent = "Tout ajouter à la liste";
        all.onclick = () => safe(async()=>{ for (const [id,v] of missing) await store.putItem(id,{name:v.name,cat:v.cat,done:false,at:Date.now()}); toast("Favoris ajoutés à la liste"); });
        head.append(all);
      }
      sec.append(head);
      const wrap = document.createElement("div"); wrap.className = "chips";
      favs.forEach(e=>wrap.append(chip(...e)));
      sec.append(wrap); body.append(sec);
    }
    byCat(entries).forEach(([k,label,items])=>{
      const sec = document.createElement("div"); sec.className = "cat";
      const h = document.createElement("h2"); h.textContent = label; sec.append(h);
      const wrap = document.createElement("div"); wrap.className = "chips";
      items.forEach(e=>wrap.append(chip(...e)));
      sec.append(wrap); body.append(sec);
    });
  }

  function chip(id, v){
    const on = list.has(id);
    const pill = document.createElement("span"); pill.className = "pill";
    const b = document.createElement("button"); b.className = "chip" + (on?" on":"");
    b.setAttribute("aria-pressed", on); b.textContent = v.name;
    const x = document.createElement("span"); x.className = "x"; x.textContent = "×"; x.setAttribute("aria-hidden","true");
    b.append(x);
    b.onclick = () => {
      if (editing){ if (confirm("Supprimer « "+v.name+" » de vos produits ?")) safe(async()=>{ await store.delProduct(id); if (list.has(id)) await store.delItem(id); }); return; }
      if (list.has(id)) safe(()=>store.delItem(id));
      else safe(()=>store.putItem(id,{name:v.name,cat:v.cat,done:false,at:Date.now()}));
    };
    const star = document.createElement("button"); star.className = "star" + (v.fav?" on":"");
    star.textContent = v.fav ? "★" : "☆";
    star.setAttribute("aria-pressed", !!v.fav);
    star.setAttribute("aria-label", (v.fav ? "Retirer des favoris : " : "Mettre en favori : ") + v.name);
    star.onclick = () => safe(()=>store.putProduct(id,{name:v.name,cat:v.cat,fav:!v.fav}));
    pill.append(b, star);
    return pill;
  }

  function render(){ renderList(); renderProducts(); }

  // ---------- Actions ----------
  const catSel = $("productCat");
  CATS.forEach(([k,l])=>{ const o=document.createElement("option"); o.value=k; o.textContent=l; catSel.append(o); });

  function showTab(which){
    const isList = which === "list";
    $("tab-list").setAttribute("aria-selected", isList); $("tab-products").setAttribute("aria-selected", !isList);
    $("view-list").hidden = !isList; $("view-products").hidden = isList;
  }
  $("tab-list").onclick = () => showTab("list");
  $("tab-products").onclick = () => showTab("products");

  $("quickForm").onsubmit = e => {
    e.preventDefault();
    const n = $("quickName").value.trim(); if (!n) return;
    $("quickName").value = "";
    const existing = [...products].find(([,v])=>v.name.toLowerCase()===n.toLowerCase());
    if (existing){ const [id,v]=existing; safe(()=>store.putItem(id,{name:v.name,cat:v.cat,done:false,at:Date.now()})); }
    else safe(()=>store.putItem("x-"+newId(n),{name:n,cat:"autre",done:false,at:Date.now()}));
  };

  $("productForm").onsubmit = e => {
    e.preventDefault();
    const n = $("productName").value.trim(); if (!n) return;
    if ([...products.values()].some(v=>v.name.toLowerCase()===n.toLowerCase())){ toast("« "+n+" » existe déjà."); return; }
    $("productName").value = "";
    safe(()=>store.putProduct(newId(n),{name:n,cat:catSel.value}));
    toast("« "+n+" » ajouté à vos produits");
  };

  $("toggleEdit").onclick = () => { editing = !editing; renderProducts(); };

  $("removeDone").onclick = () => safe(async()=>{
    for (const [id,v] of [...list]) if (v.done) await store.delItem(id);
  });
  $("clearList").onclick = () => {
    if (!list.size || !confirm("Vider toute la liste ?")) return;
    safe(async()=>{ for (const id of [...list.keys()]) await store.delItem(id); });
  };
  $("copy").onclick = async () => {
    const lines = [];
    byCat([...list].filter(([,v])=>!v.done)).forEach(([k,label,items])=>{
      lines.push(label); items.forEach(([,v])=>lines.push("- "+v.name)); lines.push("");
    });
    const text = lines.join("\n").trim();
    if (!text){ toast("Tout est déjà coché !"); return; }
    try{ await navigator.clipboard.writeText(text); toast("Liste copiée"); }
    catch(e){ toast("Copie impossible sur cet appareil"); }
  };

  // ---------- Démarrage ----------
  render();
  if (firebaseConfig.projectId && firebaseConfig.projectId !== "COLLEZ_ICI") startShared().catch(e=>{ console.error(e); mode="error"; setStatus(); });
  else startLocal();
})();
</script>
</body>
</html>
